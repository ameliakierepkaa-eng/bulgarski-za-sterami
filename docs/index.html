<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gra do nauki bułgarskiego z polskiego: codzienna plansza, kurs, zwroty, gramatyka, słówka i gry. Działa też bez internetu.">
<meta name="theme-color" content="#F3EDE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171511" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bułgarski">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Bułgarski za sterami">
<meta property="og:description" content="Nauka bułgarskiego z polskiego – codziennie 25 minut lotu nad Bułgarią.">
<meta property="og:image" content="icons/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Bułgarski za sterami</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Styl: papierowa mapa lotnicza + bułgarski haft (шевица). Czcionka Sofia Sans – bułgarskie formy cyrylicy. */
:root{
  --bg:#F3EDE2; --surface:#FFFBF3; --surface2:#EAE2D3; --ink:#1D2733; --muted:#6A6455; --line:#DCD2C0;
  --sky:#24466E; --sky-soft:#DFE5EA; --on-sky:#FFFBF3; --earth:#C2502D; --earth-soft:#F5E0D2; --on-earth:#FFFBF3;
  --ok:#3B7A4C; --ok-soft:#DFEDDC; --bad:#B3261E; --bad-soft:#F6DAD5; --gold:#C8952A;
  --map:#EFE6D2; --map-line:#DDD0B5; --water:#A9C3CC; --relief:#CDB892;
  --f-display:'Sofia Sans Condensed','Sofia Sans',system-ui,sans-serif;
  --f-body:'Sofia Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171511; --surface:#221F1A; --surface2:#2C2821; --ink:#EEE7D8; --muted:#A69E8C; --line:#3B362D;
  --sky:#93B4D8; --sky-soft:#26303B; --on-sky:#14181D; --earth:#E8774F; --earth-soft:#3E271D; --on-earth:#1A120E;
  --ok:#7DBF8B; --ok-soft:#1E3224; --bad:#EE7B6D; --bad-soft:#3F221E; --gold:#E3B85B;
  --map:#1E1B16; --map-line:#332E25; --water:#2D4650; --relief:#4B4334; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171511; --surface:#221F1A; --surface2:#2C2821; --ink:#EEE7D8; --muted:#A69E8C; --line:#3B362D;
  --sky:#93B4D8; --sky-soft:#26303B; --on-sky:#14181D; --earth:#E8774F; --earth-soft:#3E271D; --on-earth:#1A120E;
  --ok:#7DBF8B; --ok-soft:#1E3224; --bad:#EE7B6D; --bad-soft:#3F221E; --gold:#E3B85B;
  --map:#1E1B16; --map-line:#332E25; --water:#2D4650; --relief:#4B4334; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
[lang="bg"]{font-feature-settings:"locl"}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.icon{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}

/* HUD */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;font-size:14px}
.stat.streak{color:var(--earth)} .stat.xp{color:var(--sky)}
.gauge{width:46px;height:46px;flex:none}
.gauge text{font-family:var(--f-mono);font-weight:700}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
main{padding-block:20px 60px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sky);color:var(--on-sky);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--sky-soft);color:var(--sky)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.spk{border:0;background:var(--sky-soft);color:var(--sky);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.spk.big{width:64px;height:64px}
.spk.big .icon{width:28px;height:28px}
.noaudio .spk{display:none}
table.mini{border-collapse:collapse;margin:8px 0;font-size:14px}
table.mini td{padding:4px 12px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.mini td[lang="bg"]{font-weight:600}
.tblwrap{overflow-x:auto}
h2.view{font-family:var(--f-display);font-size:22px;font-weight:700;margin-bottom:4px}

/* map */
.trackswitch{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;max-width:100%}
.trackswitch button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.trackswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.next{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:16px 18px}
.next .eyebrow{color:inherit;opacity:.7}
.next b{font-family:var(--f-display);font-size:17px;display:block;margin-top:2px}
.next .btn{background:var(--surface);color:var(--ink)}
.unit{margin-top:28px}
.unit-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.unit-head h3{font-family:var(--f-display);font-size:20px;font-weight:700}
.unit-head .pl{color:var(--muted);font-weight:500}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;border-left:2px dashed var(--line)}
.wp{position:relative;display:flex;gap:14px;align-items:center;padding:6px 0}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted);z-index:1}
.wp.open .node{border-color:var(--sky);color:var(--sky);box-shadow:0 0 0 5px var(--sky-soft)}
.wp.done .node{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.wp.test .node{background:var(--sky-soft);border-color:var(--sky);color:var(--sky)}
.wpbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wp.locked .wpbtn{background:transparent;cursor:not-allowed}
.wp.locked .wpbtn .t{color:var(--muted)}
.wpbtn .t{font-weight:700;display:block}
.wpbtn .b{font-size:13px;color:var(--muted)}
.stars{display:flex;gap:2px;color:var(--line);flex:none}
.stars .on{color:var(--gold)}
.welcome{border:1.5px solid var(--sky);background:var(--sky-soft)}

/* phrase / dict lists */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .txt{flex:1;min-width:0}
.prow .bg{font-weight:700;font-size:17px}
.prow .tr{font-family:var(--f-mono);font-size:12px;color:var(--earth)}
.prow .pl{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.gcard h3{font-family:var(--f-display);font-size:16px;margin-bottom:6px}
.gcard p{margin:6px 0}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson-top{display:flex;align-items:center;gap:12px;padding-block:12px}
.xbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.pbar{flex:1;height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .35s ease}
.lesson-body{flex:1;overflow-y:auto}
.lesson-body .wrap{padding-block:12px 24px}
.prompt-kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--earth);margin-bottom:6px}
.prompt{font-family:var(--f-display);font-size:clamp(20px,5vw,26px);font-weight:500;line-height:1.3;margin-bottom:6px}
.prompt [lang="bg"]{font-weight:700}
.sub{color:var(--muted);margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;min-height:56px}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:16px}
.tiles.bank{border:0}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 13px;font-size:17px;font-weight:600}
.tile.used{visibility:hidden}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matchgrid .col{display:grid;gap:10px;align-content:start;min-width:0}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;min-height:52px;text-align:center;overflow-wrap:anywhere}
.mt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.mt.gone{opacity:.25;pointer-events:none}
.mt.err{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;font:inherit;font-size:19px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);resize:none}
.kb{display:grid;gap:6px;margin-top:12px}
.kb .krow{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:44px;min-width:0;height:42px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:8px;font-size:17px;padding:0}
.kb button.wide{max-width:90px;flex:2;font-size:13px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:10px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--earth);color:var(--on-earth);display:grid;place-items:center;margin:8px auto}
.mic .icon{width:40px;height:40px}
.mic.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--earth-soft)}50%{box-shadow:0 0 0 16px var(--earth-soft)}}
.heard{min-height:28px;text-align:center;font-size:18px;font-weight:600}
.heard i{color:var(--muted);font-weight:400}
.target{font-size:22px;font-weight:700;text-align:center}
.tr-line{font-family:var(--f-mono);font-size:13px;color:var(--earth);text-align:center}
.lesson-foot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson-foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.lesson-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.foot-in{display:flex;flex-direction:column;gap:10px;padding-block:14px}
.fb{display:none}
.lesson-foot.ok .fb,.lesson-foot.bad .fb{display:flex;gap:12px;align-items:flex-start}
.fb .msg{flex:1;min-width:0}
.fb h4{margin:0;font-size:18px}
.lesson-foot.ok h4{color:var(--ok)} .lesson-foot.bad h4{color:var(--bad)}
.fb .ans{font-weight:700;font-size:17px}
.fb .note{font-size:14px;color:var(--muted)}
.foot-btns{display:flex;gap:10px}
.foot-btns .btn{flex:1}
.brief .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.wcell{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.wcell div{min-width:0}
.wcell b{display:block}
.wcell small{color:var(--muted)}
.tipbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tipbox p{margin:6px 0}
.result{text-align:center}
.bigstars{display:flex;justify-content:center;gap:10px;margin:14px 0}
.bigstars .icon{width:52px;height:52px;color:var(--line)}
.bigstars .on .icon{color:var(--gold);filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--gold) 45%,transparent))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:22px}
.kpi span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--sky);color:var(--sky);background:var(--sky-soft)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* plansza gry */
.stagehead{margin-bottom:14px}
.stagehead h2{margin:4px 0}
.board{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:360/640;border-radius:6px;overflow:hidden;border:2px solid var(--ink);background:var(--map);box-shadow:5px 5px 0 var(--surface2)}
.board::after{content:"";position:absolute;inset:6px;border:1px solid var(--ink);opacity:.35;pointer-events:none;border-radius:2px}
.board-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tnode{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;width:96px}
.disc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--ink);color:var(--ink);outline:1.5px solid var(--ink);outline-offset:3px}
.disc .icon{width:24px;height:24px}
.disc .ill{width:42px;height:42px}
.glyph{font-family:var(--f-display);font-weight:800;font-size:19px}
.tnode.cur .disc{border-color:var(--earth);color:var(--earth);outline-color:var(--earth);box-shadow:0 0 0 9px var(--earth-soft);animation:bump 1.6s ease-in-out infinite}
.tnode.done .disc{background:var(--sky);border-color:var(--sky);color:var(--on-sky);outline-color:var(--sky)}
.tnode.locked{cursor:not-allowed}
.tnode.locked .disc{background:var(--map);border-style:dashed;color:var(--muted);outline:0}
.tcap{display:flex;flex-direction:column;align-items:center;line-height:1.1;max-width:100%;text-shadow:0 0 3px var(--map),0 0 3px var(--map),0 0 6px var(--map)}
.tcap b{font-family:var(--f-display);font-size:14px;font-weight:800;white-space:nowrap;letter-spacing:.01em}
.tcap small{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.ministars{color:var(--gold);letter-spacing:1px}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cityp{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;background:var(--ink);color:var(--bg);border-radius:4px;padding:5px 12px 4px;max-width:70%;text-align:center}
.cityp b{font-family:var(--f-display);font-size:18px;font-weight:800;line-height:1.1;letter-spacing:.02em}
.cityp span{font-family:var(--f-mono);font-size:10px;opacity:.85;letter-spacing:.04em}
.cityp i{font-style:normal}
.cityp.start{transform:translate(-50%,-6%)}
.cityp.dest{background:var(--surface);color:var(--ink);border:2px dashed var(--earth)}
.cityp.dest.reached{background:var(--earth);color:var(--on-earth);border-style:solid}
.hero{position:absolute;width:78px;transform:translate(-50%,-96%);z-index:3;transition:left 1.3s cubic-bezier(.5,0,.3,1),top 1.3s cubic-bezier(.5,0,.3,1);pointer-events:none}
.hero svg{display:block;width:100%;height:auto;animation:bob 2.4s ease-in-out infinite}
.hero .rotor{transform-box:fill-box;transform-origin:center;animation:spin .28s linear infinite}
.hero .prop{transform-box:fill-box;transform-origin:center;animation:spinv .18s linear infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
@keyframes spinv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cloud{animation:drift 14s ease-in-out infinite alternate;opacity:.9}
.cloud.c2{animation-duration:18s}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
.postcard{margin-top:16px;border:2px solid var(--earth);background:var(--earth-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}

    out += t;

  Object.entries(od.lv || {}).forEach(([id, v]) => { const c = m.lv[id]; if (!c || (v.stars || 0) > (c.stars || 0)) m.lv[id] = v; });
  if ((od.lastDay || '') > (m.lastDay || '')) { m.lastDay = od.lastDay; m.streak = od.streak; }
  else if (od.lastDay === m.lastDay) m.streak = Math.max(m.streak, od.streak);
  if (od.daily && m.daily && od.daily.date === m.daily.date) m.daily.xp = Math.max(m.daily.xp, od.daily.xp);

  else if (gb.day && ga.day && gb.day.date === ga.day.date && gb.day.stage === ga.day.stage) {
    ga.day.tiles.forEach((t, i) => { const o = gb.day.tiles[i]; if (o && o.done && !t.done) { t.done = true; t.stars = o.stars; if (o.id) t.id = o.id; } });
    ga.day.finished = ga.day.finished || gb.day.finished;
  }
  Object.entries(od.best || {}).forEach(([k, v]) => { m.best[k] = Math.max(m.best[k] || 0, v); });
  if (!m.placement && od.placement) m.placement = od.placement;
  m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return m;
}
function applyRemote(d) {
  if (!d || !d.state) return false;
  let remote; try { remote = JSON.parse(d.state); } catch (e) { return false; }
  const before = JSON.stringify(S);
  S = mergeStates(S, remote);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  const changed = JSON.stringify(S) !== before;
  if (changed && !L) { renderHud(); route(); }
  return JSON.stringify(S) !== d.state;
}
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    cloud = ref; syncState = 'cloud';
    if (snap.exists) { if (applyRemote(snap.data())) cloudSave(); }
    else if (S.updatedAt) cloudSave();
    ref.onSnapshot(sn => { if (sn.exists && !cloudBusy) { const d = sn.data(); if (d && (d.updatedAt || 0) > (S.updatedAt || 0)) applyRemote(d); } }, () => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cloud) cloud.get().then(sn => { if (sn.exists && applyRemote(sn.data())) cloudSave(); }).catch(() => {}); });
    if ($('#syncline')) $('#syncline').textContent = syncText();
  } catch (e) { cloud = null; }
}

const RANKS = [[0,'Курсантка','Kursantka'],[120,'Пилот','Pilotka'],[400,'Командир','Dowódczyni'],[900,'Инструктор','Instruktorka'],[1600,'Ас','As przestworzy']];
const rankOf = xp => { let r = 0; RANKS.forEach((k, i) => { if (xp >= k[0]) r = i; }); return r; };
function streakNow() { return (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0; }
function dailyXP() { return S.daily.date === today() ? S.daily.xp : 0; }
function addXP(n) {
  if (n <= 0) return;
  const before = rankOf(S.xp);
  S.xp += n;
  if (S.daily.date !== today()) S.daily = {date:today(), xp:0};
  S.daily.xp += n;
  if (S.lastDay !== today()) { S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = today(); }
  const after = rankOf(S.xp);
  if (after > before) setTimeout(() => toast(`Awans! Nowa ranga: ${RANKS[after][1]} (${RANKS[after][2]})`), 600);
}
function renderHud() {

    <g clip-path="url(#gc)"><rect x="0" y="0" width="46" height="46" fill="var(--sky)"/><rect x="0" y="${earthTop}" width="46" height="46" fill="var(--earth)"/>
    <line x1="0" x2="46" y1="${earthTop}" y2="${earthTop}" stroke="var(--on-sky)" stroke-width="1.5"/></g>

const lvState = id => S.lv[id] || null;
const isDone = id => { const s = lvState(id); return !!(s && (s.stars > 0 || s.test)); };
function isOpen(l) {
  const list = TRACK[l.unit.track]; const idx = list.indexOf(l);
  if (idx === 0) return l.unit.track === 'day' ? true : (isDone('d0-2') || isDone('d0-1'));

/* ===== LEKTOR (TTS) I DYKTOWANIE ===== */
let tts = null, audioMode = ('speechSynthesis' in window) ? 'browser' : 'none', dict = null, dictOff = false;
function bgVoice() { try { return speechSynthesis.getVoices().find(v => (v.lang || '').toLowerCase().startsWith('bg')); } catch (e) { return null; } }
function audioOK() { return audioMode === 'claude' || (audioMode === 'browser' && !!bgVoice()); }
function speak(text, slow) {
  text = String(text).replace(/…/g, ' ');
  if (audioMode === 'claude' && tts) {
    tts.speak(text, {language:'bg', rate: slow ? 0.72 : S.rate}).catch(e => {
      const c = e && e.code;
      if (c === 'not_granted' || c === 'unavailable') { audioMode = 'none'; applyAudioClass(); toast('Lektor jest wyłączony dla tej strony. Ćwiczenia ze słuchu pokażą tekst.'); }
      else if (c === 'rate_limited') toast('Lektor potrzebuje chwili przerwy. Spróbuj za moment.');
      else if (c === 'no_gesture') toast('Kliknij przycisk głośnika, aby odsłuchać.');
    });
    return;
  }
  if (audioMode === 'browser') {
    try { const u = new SpeechSynthesisUtterance(text); u.lang = 'bg-BG'; const v = bgVoice(); if (v) u.voice = v; u.rate = slow ? 0.7 : S.rate; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }
}
function applyAudioClass() { document.body.classList.toggle('noaudio', !audioOK()); }
/* Rozpoznawanie mowy przeglądarki (Chrome na Androidzie i komputerze, Safari) – ten sam interfejs co dyktowanie w claude.ai */
function webDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  const subs = {final:new Set(), partial:new Set(), state:new Set()};
  const emit = (k, v) => subs[k].forEach(f => { try { f(v); } catch (e) {} });
  const on = k => cb => { subs[k].add(cb); return () => subs[k].delete(cb); };
  const codeOf = err => (err === 'not-allowed' || err === 'service-not-allowed') ? 'not_granted' : err === 'language-not-supported' ? 'unavailable' : err === 'aborted' ? 'stopped' : err;
  let rec = null, live = false;
  return {
    active: () => live,
    start() {
      return new Promise((res, rej) => {
        try {
          rec = new SR(); rec.lang = 'bg-BG'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
          let started = false;
          rec.onstart = () => { started = live = true; emit('state', {state:'listening'}); res(); };
          rec.onresult = e => {
            let interim = '';
            for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) emit('final', {text:' ' + r[0].transcript}); else interim += r[0].transcript; }
            emit('partial', {text:interim});
          };
          rec.onerror = e => {
            const code = codeOf(e.error);
            if (!started) rej({code});
            else if (code === 'not_granted' || code === 'unavailable') emit('state', {state:'idle', reason:code});
          };

    stop() { try { if (rec) rec.stop(); } catch (e) {} return Promise.resolve(); },

}
function initSpeech() {

async function testMic(out) {
  if (!dict) return;
  let got = '', offs = [];
  const done = msg => { offs.forEach(f => { try { f(); } catch (e) {} }); offs = []; out.innerHTML = msg; };
  out.innerHTML = 'Słucham… powiedz wyraźnie: <b lang="bg">Здравей</b>';
  offs.push(dict.onFinal(e => { got += e.text; }));
  offs.push(dict.onPartial(e => { if (e.text) out.innerHTML = `Słyszę: <span lang="bg">${esc(e.text)}</span>`; }));
  offs.push(dict.onState(s => { if (s.state !== 'idle') return;
    done(got.trim() ? `Rozpoznano: <b lang="bg">${esc(got.trim())}</b> – mikrofon działa ✓`
      : s.reason === 'not_granted' ? 'Brak dostępu do mikrofonu. Zezwól na mikrofon (krok 3 poniżej) i spróbuj ponownie.'
      : 'Nic nie rozpoznano. Sprawdź internet i spróbuj jeszcze raz.'); }));
  try { await dict.start(); setTimeout(() => { try { dict.stop(); } catch (e) {} }, 6000); }
  catch (e) { done(e && e.code === 'not_granted' ? 'Brak dostępu do mikrofonu. Zezwól na mikrofon (krok 3 poniżej) i spróbuj ponownie.' : 'Rozpoznawanie mowy nie ruszyło – sprawdź internet albo instrukcję poniżej.'); }
}

/* ===== WIDOK: TEST WSTĘPNY ===== */
let PT = null;
function viewTest() {
  if (!PT || PT.done) PT = {i:0, answers:[], qs:PLACEMENT.map(q => ({...q, opts: shuffle(q.o)})), done:false};
  drawTestQ();
}
function drawTestQ() {
  const q = PT.qs[PT.i];
  $('#view').innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Test wstępny</span><span class="qcount">${PT.i + 1} / ${PT.qs.length}</span></div>
    <div class="pbar"><i style="width:${100 * PT.i / PT.qs.length}%"></i></div>
    <div class="prompt" style="margin-top:8px">${q.q}</div>
    <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-a="${esc(o)}"><span class="k">${i + 1}</span><span ${/[а-я]/i.test(o) ? 'lang="bg"' : ''}>${esc(o)}</span></button>`).join('')}
    <button class="opt" data-a="__idk"><span class="k">${q.opts.length + 1}</span><span class="muted">Nie wiem</span></button></div>
    <p class="muted" style="font-size:14px">Jeśli nie znasz odpowiedzi, wybierz „Nie wiem” – test będzie dokładniejszy niż przy zgadywaniu.</p></div>`;
  $$('.opt').forEach(b => b.onclick = () => {
    PT.answers[PT.i] = b.dataset.a === q.o[0];
    PT.i++;
    if (PT.i >= PT.qs.length) finishTest(); else drawTestQ();
  });
}
function finishTest() {
  PT.done = true;
  const tiers = [0,1,2,3,4].map(t => { const idx = PT.qs.map((q, i) => q.tier === t ? i : -1).filter(i => i >= 0); const ok = idx.filter(i => PT.answers[i]).length; return {t, ok, n:idx.length, pass: ok >= idx.length - 1 && ok >= 2}; });
  const skills = {}; PT.qs.forEach((q, i) => { skills[q.sk] = skills[q.sk] || {ok:0, n:0}; skills[q.sk].n++; if (PT.answers[i]) skills[q.sk].ok++; });
  const score = PT.answers.filter(Boolean).length;
  const cefr = score <= 4 ? 'A0' : score <= 9 ? 'A1' : score <= 14 ? 'A1+' : 'A2';
  /* codzienne: zaliczamy etapy po kolei, dopóki zdany jest próg */
  const dayUnits = [['d0'], ['d1','d2'], ['d3'], ['d4']];
  const passedDay = []; for (let t = 0; t < 4; t++) { if (tiers[t].pass) passedDay.push(...dayUnits[t]); else break; }
  const passedAir = tiers[4].pass && passedDay.length ? ['a0'] : [];
  const nextDay = TRACK.day.find(l => !passedDay.includes(l.unit.id));
  const nextAir = TRACK.air.find(l => !passedAir.includes(l.unit.id));
  const skName = {voc:'Słownictwo', read:'Czytanie i rozumienie', gram:'Gramatyka', air:'Słownictwo lotnicze'};
  const weakest = Object.entries(skills).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n)[0][0];
  const weakTip = {voc:'Codziennie przejrzyj 10 zwrotów w zakładce Zwroty i odsłuchaj je.', read:'Czytaj na głos zdania z lekcji – transkrypcja pod tekstem pomoże z cyrylicą.', gram:'Zacznij dzień od jednej karty w zakładce Gramatyka (najpierw: rodzajnik i „да”).', air:'Trasa lotnicza – jeden level dziennie, a potem rozmówki „Lotnisko i aeroklub”.'}[weakest];
  const planShort = `Start: „${nextDay ? nextDay.t : 'trasa ukończona'}” i „${nextAir ? nextAir.t : 'trasa lotnicza ukończona'}”. Słabszy punkt: ${skName[weakest].toLowerCase()}.`;
  PT.result = {score, cefr, passedDay, passedAir, planShort};
  $('#view').innerHTML = `<div class="stack">
   <div class="card stack"><div class="eyebrow">Wynik testu</div>
    <div class="row" style="align-items:baseline"><b style="font-family:var(--f-display);font-size:34px">${cefr}</b><span class="muted">${score} z ${PT.qs.length} poprawnych</span></div>
    ${Object.entries(skills).map(([k, v]) => `<div><div class="row" style="justify-content:space-between;font-size:14px"><span>${skName[k]}</span><span class="mono">${v.ok}/${v.n}</span></div><div class="bar"><i style="width:${100 * v.ok / v.n}%"></i></div></div>`).join('')}
   </div>
   <div class="card stack"><div class="eyebrow">Twój plan lotu</div>
    <div><b>Na co dzień:</b> ${passedDay.length ? `zaliczasz ${passedDay.length} ${passedDay.length === 1 ? 'etap' : 'etapy'} i ` : ''}zaczynasz od „${esc(nextDay ? nextDay.t : '—')}”.</div>
    <div><b>Lotnictwo:</b> ${passedAir.length ? 'znasz podstawy, więc ' : ''}zaczynasz od „${esc(nextAir ? nextAir.t : '—')}”.</div>

function seedRng(str) {

  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}

function confetti() {

  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4200);

const reachedLevels = () => { const r = LEVELS.filter(l => isOpen(l)); return r.length ? r : [LEVELS[0]]; };
const reachedNouns = () => { const ids = new Set(reachedLevels().map(l => l.id)); let idx = NOUNS.map((n, i) => ids.has(n[4]) ? i : -1).filter(i => i >= 0); if (idx.length < 8) idx = [...new Set([...idx, ...NOUNS.map((_, i) => i).slice(0, 10)])]; return idx; };
const catUnlocked = name => name === 'Podstawy' || (PH_UNLOCK[name] && LV[PH_UNLOCK[name]] && isOpen(LV[PH_UNLOCK[name]]));
function myPhrases(filter = 'all') {
  const out = [];
  if (filter === 'all' || filter !== 'lv') PHRASES.forEach((c, ci) => { if (!catUnlocked(c.n) || (filter !== 'all' && filter !== c.n)) return; const lv = LV['ph' + ci]; lv.s.forEach((x, i) => out.push({pl:x[0], bg:x[1], lv, i, src:c.n})); });
  if (filter === 'all' || filter === 'lv') reachedLevels().forEach(lv => lv.s.forEach((x, i) => out.push({pl:x[0], bg:x[1], lv, i, src:lv.t})));
  return out;
}
const byMistakes = arr => shuffle(arr).sort((a, b) => (S.mistakes[b.ref] || 0) - (S.mistakes[a.ref] || 0));
const take = (arr, n) => { const out = []; for (let k = 0; k < n && arr.length; k++) out.push(arr[k % arr.length]); return out; };
function finishBest(key, val) { if (val > (S.best[key] || 0)) { S.best[key] = val; save(); return true; } return false; }

let phMode = 'fiszki', phFilter = 'all', FC = null, MG = null, phraseQ = '';

function drawFlash() {

  }

  const front = FC.dir === 'pl' ? `<div class="fpl">${esc(c.pl)}</div>` : `<div class="fbg" lang="bg">${esc(c.bg)}</div><div class="tr-line">${esc(translit(c.bg))}</div>`;
  const back = FC.dir === 'pl' ? `<div class="fbg" lang="bg">${esc(c.bg)}</div><div class="tr-line">${esc(translit(c.bg))}</div><div class="muted">${esc(c.pl)}</div>` : `<div class="fpl">${esc(c.pl)}</div><div class="muted" lang="bg">${esc(c.bg)}</div>`;

  const yes = $('#fcYes'); if (yes) yes.onclick = () => { FC.deck.shift(); FC.known++; FC.flipped = false; if (FC.known % 5 === 0) { addXP(2); save(); renderHud(); } drawFlash(); };
}
function drawMatchGame() {
  const box = $('#phbox');
  if (!MG || MG.done) {
    const pool = shuffle(myPhrases(phFilter));
    MG = {pairs:pool.slice(0, 5), left:Math.min(5, pool.length), miss:0, t0:Date.now(), selL:null, selR:null, done:false};
  }
  const P5 = MG.pairs;
  const Lc = shuffle(P5.map((x, j) => ({k:j, v:x.pl}))), Rc = shuffle(P5.map((x, j) => ({k:j, v:x.bg})));
  box.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="qcount" id="mgInfo">Pary: 0/${P5.length} · błędy: 0</span><span class="qcount">Rekord: ${S.best.match || 0} pkt</span></div>
   <div class="matchgrid phm"><div class="col">${Lc.map(x => `<button class="mt" data-side="l" data-k="${x.k}">${esc(x.v)}</button>`).join('')}</div>
   <div class="col">${Rc.map(x => `<button class="mt" lang="bg" data-side="r" data-k="${x.k}">${esc(x.v)}</button>`).join('')}</div></div><div id="mgEnd"></div>`;
  let got = 0;
  box.querySelector('.matchgrid').onclick = e => {
    const b = e.target.closest('.mt'); if (!b || b.classList.contains('gone')) return;
    const side = b.dataset.side;
    $$(`.mt[data-side="${side}"]`, box).forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    if (side === 'l') MG.selL = b; else MG.selR = b;
    if (!MG.selL || !MG.selR) return;
    const a = MG.selL, c = MG.selR; MG.selL = MG.selR = null;
    if (a.dataset.k === c.dataset.k) { a.classList.add('gone'); c.classList.add('gone'); got++; if (audioOK()) speak(c.textContent); }
    else { MG.miss++; [a, c].forEach(x => { x.classList.add('err'); x.setAttribute('aria-pressed', 'false'); setTimeout(() => x.classList.remove('err'), 500); }); }
    $('#mgInfo').textContent = `Pary: ${got}/${P5.length} · błędy: ${MG.miss}`;
    if (got === P5.length) {
      MG.done = true;
      const sec = Math.round((Date.now() - MG.t0) / 1000), pts = Math.max(10, 150 - sec * 2 - MG.miss * 10);

      $('#mgNext').onclick = () => drawMatchGame();
    }
  };
}

/* ===== ODMIANA CZASOWNIKÓW ===== */
const PRON = [['аз','ja'],['ти','ty'],['той','on'],['ние','my'],['вие','wy'],['те','oni']];
const TENSE_PL = {pres:'czas teraźniejszy', past:'czas przeszły', fut:'czas przyszły'};
const vForms = (v, tense) => (tense === 'past' ? v[3] : v[2]).split(' ');
function verbTenses(v) { const pair = v[1].includes(' / '); return v[5] ? ['fut', 'past'] : pair ? ['pres', 'past'] : ['pres', 'past', 'fut']; }
function verbItem(vi, tense, p) {
  const v = VERBS[vi], forms = vForms(v, tense), refl = v[6] ? 'се ' : '';
  let pron = PRON[p][0], plp = PRON[p][1];
  if (p === 2 && Math.random() < 0.5) { pron = 'тя'; plp = 'ona'; }
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const s = tense === 'past' ? `Вчера ${pron} ${refl}___.` : tense === 'fut' ? `Утре ${pron} ще ${refl}___.` : `${cap(pron)} ${refl}___.`;
  const correct = forms[p];
  const others = [...new Set([...vForms(v, 'pres'), ...vForms(v, 'past')])].filter(f => f !== correct);
  const o = [correct, ...shuffle(others).slice(0, 3)];
  const table = vForms(v, tense).map((f, i) => `${PRON[i][0]} ${tense === 'fut' ? 'ще ' : ''}${refl}${f}`).join(', ');
  return {t:'gram', it:{kind:'g', lv:null, i:0, ref:`v:${vi}:${tense}:${p}`, g:{s, o, pl:`${TENSE_PL[tense]} · ${plp} · ${v[0]} (${v[1]})`, why:`Odmiana: <span lang="bg">${esc(table)}</span>.${v[4] ? ' ' + esc(v[4]) : ''}`}}};
}
function verbItems(n) {
  const all = VERBS.flatMap((v, vi) => verbTenses(v).flatMap(t => [0,1,2,3,4,5].map(p => ({vi, t, p}))));
  const sorted = shuffle(all).sort((a, b) => (S.mistakes[`v:${b.vi}:${b.t}:${b.p}`] || 0) - (S.mistakes[`v:${a.vi}:${a.t}:${a.p}`] || 0));
  const out = [], usedV = new Set();
  for (const x of sorted) { if (usedV.has(x.vi) && usedV.size < VERBS.length) continue; usedV.add(x.vi); out.push(verbItem(x.vi, x.t, x.p)); if (out.length >= n) break; }
  return out;
}
function verbsCheat() {
  return `<article class="card gcard"><h3>Odmiana czasowników (${VERBS.length})</h3><p class="muted" style="margin-top:0">Kliknij czasownik, żeby zobaczyć odmianę. Czas przyszły: <span lang="bg">ще</span> + forma teraźniejsza (<span lang="bg">ще летя, ще летиш…</span>).</p>
    <div class="verbs">${VERBS.map(v => `<details class="vb"><summary><b lang="bg">${esc(v[1])}</b> <span class="muted">${esc(v[0])}</span></summary><div class="tblwrap"><table class="mini"><tr><td></td><td><b>${v[5] ? 'po да / ще' : 'teraz'}</b></td><td><b>wczoraj (aoryst)</b></td></tr>${PRON.map(([bg, pl], i) => `<tr><td>${pl}</td><td lang="bg">${bg} ${v[5] ? 'ще ' : ''}${v[6] ? 'се ' : ''}${esc(vForms(v, 'pres')[i])}</td><td lang="bg">${bg} ${v[6] ? 'се ' : ''}${esc(vForms(v, 'past')[i])}</td></tr>`).join('')}</table></div>${v[4] ? `<p class="muted" style="margin:4px 0 0;font-size:14px">${esc(v[4])}</p>` : ''}</details>`).join('')}</div></article>`;
}
function grammarItems(kind) {
  if (kind === 'verbs') return verbItems(12);
  const lv = reachedLevels();
  if (kind === 'order') {
    const pool = byMistakes([...lv.flatMap(l => l.s.map((_, i) => SN(l, i))), ...PHRASES.map((c, ci) => catUnlocked(c.n) ? LV['ph' + ci].s.map((_, i) => SN(LV['ph' + ci], i)) : []).flat()]);
    return take(pool, 10).map(it => ({t:'order', it}));
  }
  if (kind === 'gender') return take(byMistakes(reachedNouns().map(NI)), 10).map(it => ({t:'gender', it}));
  if (kind === 'article') return take(byMistakes(reachedNouns().map(NI)), 10).map(it => ({t:'article', it}));
  return take(byMistakes(lv.flatMap(l => l.g.map((_, i) => GR(l, i)))), 10).map(it => ({t:'gram', it}));
}
const GTITLE = {verbs:'Odmiana czasowników', order:'Ułóż zdanie', gender:'Rodzaj: męski, żeński, nijaki', article:'Rodzajnik: -ът / -та / -то', gram:'Gramatyka z leveli'};

    ${card('gender', '<span class="glyph" lang="bg">той тя то</span>', 'Czy słowo jest męskie, żeńskie czy nijakie? Po bułgarsku rodzaj często jest inny niż po polsku.', nN + ' rzeczowników')}
    ${card('article', '<span class="glyph" lang="bg">-ът -та -то</span>', 'Bułgarzy doklejają końcówkę, gdy mówią o czymś konkretnym: самолет → самолетът.', nN + ' rzeczowników')}
    ${card('gram', '<span class="glyph">___</span>', 'Uzupełnianie luk: formy czasowników, przyimki, czas przyszły i przeszły.', nG + ' zadań')}
   </div>
   <h3 class="eyebrow" style="margin:26px 0 8px">Ściąga</h3>
   <div class="stack">${verbsCheat()}${GRAMMAR.map(g => `<article class="card gcard"><h3>${esc(g.t)}</h3><div class="tblwrap">${g.h}</div></article>`).join('')}</div>`;
  $$('[data-g]').forEach(b => b.onclick = () => { const k = b.dataset.g; const go = () => startPractice(null, grammarItems(k), GTITLE[k], go); go(); });
}

/* ===== ZAKŁADKA: GRY I ZABAWY ===== */
let G = null, blitzT = null;
function viewGames() {
  if (blitzT) { clearInterval(blitzT); blitzT = null; }
  $('#view').innerHTML = `<h2 class="view">Gry i zabawy</h2><p class="muted" style="margin-top:0">Na rozluźnienie po lekcjach. Za każdą grę dostajesz trochę XP.</p>
   <div class="gamegrid">
    <button class="gamecard" data-game="songs"><span class="gicon">${'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18a3 3 0 1 1-2-2.8V5l12-2v12a3 3 0 1 1-2-2.8V6.4L9 7.8z"/></svg>'}</span><b>Piosenka z luką</b><span class="muted">Fragment bułgarskiej pieśni lub wiersza z jedną luką. Wybierz brakujące słowo: A, B, C czy D? ${LYRIC_ITEMS.length} zadań.</span><span class="qcount">Rekord: ${S.best.songs2 || 0}/10</span></button>
    <button class="gamecard" data-game="blitz"><span class="gicon">${'<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>'}</span><b>Błyskawica 60 s</b><span class="muted">Ile słówek przetłumaczysz w minutę? Słówka z Twoich leveli.</span><span class="qcount">Rekord: ${S.best.blitz || 0}</span></button>
    <button class="gamecard" data-game="memo"><span class="gicon"><span class="glyph" lang="bg">Аа ⇄ Pp</span></span><b>Memory: pary</b><span class="muted">Odkrywaj karty i łącz słówka w pary: polskie z bułgarskim. Im mniej ruchów, tym lepiej.</span><span class="qcount">Rekord: ${S.best.memo ? S.best.memo + ' pkt' : '–'}</span></button>
   </div><div id="gamebox" style="margin-top:18px"></div>`;
  $$('[data-game]').forEach(b => b.onclick = () => { ({songs:startSongs, blitz:startBlitz, memo:startMemo})[b.dataset.game](); setTimeout(() => $('#gamebox').scrollIntoView({behavior:'smooth', block:'start'}), 30); });
}
/* --- Piosenka z luką --- */
const LYRIC_ITEMS = LYRICS.flatMap((l, li) => l.gaps.map(([w, wrong], gi) => ({li, gi, w, wrong})));
const isLetter = ch => !!ch && /[A-Za-zА-Яа-яЁёЀ-ӿ]/.test(ch);
/* każde wystąpienie słowa (bez względu na wielkość liter) zamienia na lukę albo na wyróżnione słowo */
function gapHTML(text, w, fill) {
  const lo = text.toLowerCase(), lw = w.toLowerCase(); let out = '', from = 0, i, n = 0;
  while ((i = lo.indexOf(lw, from)) >= 0) {
    if (isLetter(text[i - 1]) || isLetter(text[i + w.length])) { out += esc(text.slice(from, i + 1)); from = i + 1; continue; }
    out += esc(text.slice(from, i)) + (fill ? `<b class="gap filled">${esc(text.slice(i, i + w.length))}</b>` : '<span class="gap">?</span>'); from = i + w.length; n++;
  }
  return n ? out + esc(text.slice(from)) : null;
}
function startSongs() {
  const used = new Set(), qs = [];
  for (const it of shuffle(LYRIC_ITEMS)) { if (used.has(it.li) && qs.length < LYRICS.length) continue; used.add(it.li); qs.push(it); if (qs.length >= 10) break; }
  G = {type:'songs', qs, i:0, score:0}; drawSong();
}
function drawSong() {
  const box = $('#gamebox'); if (!box) return;
  if (G.i >= G.qs.length) {
    const rec = finishBest('songs2', G.score); addXP(G.score); save(); renderHud();
    box.innerHTML = `<div class="card stack" style="text-align:center"><b style="font-family:var(--f-display);font-size:24px">${G.score} / ${G.qs.length}${rec ? ' · nowy rekord!' : ''}</b><span class="muted">+${G.score} XP · w grze jest ${LYRIC_ITEMS.length} luk z ${LYRICS.length} fragmentów</span><button class="btn" id="gAgain">Następne 10</button></div>`;
    $('#gAgain').onclick = startSongs; return;
  }
  const q = G.qs[G.i], L0 = LYRICS[q.li], opts = shuffle([q.w, ...q.wrong]);
  box.innerHTML = `<div class="card stack lyric"><div class="row" style="justify-content:space-between"><span class="eyebrow">Luka ${G.i + 1}/${G.qs.length}</span><span class="qcount">Wynik: ${G.score}</span></div>
    <div><div class="song-title"><span class="eyebrow">Utwór</span> <b lang="bg">„${esc(L0.song)}”</b></div><div class="muted" style="font-size:14px">${esc(L0.who)}</div></div>
    <div class="lline" lang="bg" id="lyr">„${gapHTML(L0.text, q.w, false)}”</div>
    <b>Jakie słowo pasuje w lukę?</b>
    ${optsHTML(opts, true, true)}<div id="sfb"></div></div>`;
  let answered = false;
  $$('#gamebox .opt').forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = b.dataset.v === q.w; if (ok) G.score++;
    $$('#gamebox .opt').forEach(x => { if (x.dataset.v === q.w) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    $('#lyr').innerHTML = `„${gapHTML(L0.text, q.w, true)}”`;
    $('#sfb').innerHTML = `<div class="${ok ? 'okbox' : 'badbox'}"><b>${ok ? 'Brawo!' : `Brakowało słowa: ${esc(q.w)}`}</b><div class="row" style="gap:10px;flex-wrap:nowrap">${spkBtn(L0.text)}<div><div lang="bg">${esc(L0.text)}</div><div class="tr-line" style="text-align:left">${esc(translit(L0.text))}</div></div></div><div>Tłumaczenie: <i>${esc(L0.tr)}</i></div></div><button class="btn block" id="sNext" style="margin-top:10px">Dalej</button>`;
    $('#sNext').onclick = () => { G.i++; drawSong(); };
    if (audioOK() && S.autoVoice) speak(L0.text);
  });
}
function startBlitz() {
  const pool = shuffle(reachedLevels().flatMap(l => l.w.map((_, i) => W(l, i))));
  G = {type:'blitz', pool, k:0, score:0, end:Date.now() + 60000};
  if (blitzT) clearInterval(blitzT);
  blitzT = setInterval(() => {
    const box = $('#gamebox'); if (!box || G.type !== 'blitz') { clearInterval(blitzT); blitzT = null; return; }
    const left = Math.max(0, G.end - Date.now());
    const bar = $('#bzBar'); if (bar) bar.style.width = `${left / 600}%`;
    const tt = $('#bzT'); if (tt) tt.textContent = Math.ceil(left / 1000) + ' s';
    if (left <= 0) { clearInterval(blitzT); blitzT = null; endBlitz(); }
  }, 200);
  drawBlitz();
}
function drawBlitz() {
  const box = $('#gamebox'); if (!box) return;
  const it = G.pool[G.k % G.pool.length], bg = first(it.w[1]);
  const opts = shuffle([bg, ...distractWords(it, 3, 'bg')]);
  box.innerHTML = `<div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Błyskawica</span><span class="mono" id="bzT">60 s</span><span class="qcount">Punkty: ${G.score}</span></div>
    <div class="bar"><i id="bzBar" style="width:${Math.max(0, G.end - Date.now()) / 600}%;background:var(--earth)"></i></div>
    <div class="prompt" style="text-align:center;margin:8px 0">${esc(it.w[0])}</div>${optsHTML(opts, true)}</div>`;
  $$('#gamebox .opt').forEach(b => b.onclick = () => {
    if (G.end <= Date.now()) return;
    const ok = b.dataset.v === bg;
    if (ok) { G.score++; G.k++; drawBlitz(); }
    else { b.classList.add('wrong'); $$('#gamebox .opt').forEach(x => { if (x.dataset.v === bg) x.classList.add('right'); x.disabled = true; }); G.k++; setTimeout(() => { if (G.type === 'blitz' && G.end > Date.now()) drawBlitz(); }, 700); }
  });
}
function endBlitz() {
  const box = $('#gamebox'); if (!box) return;
  const rec = finishBest('blitz', G.score); addXP(Math.min(20, G.score)); save(); renderHud();
  box.innerHTML = `<div class="card stack" style="text-align:center"><span class="eyebrow">Koniec czasu</span><b style="font-family:var(--f-display);font-size:28px">${G.score} słówek${rec ? ' · rekord!' : ''}</b><span class="muted">Najlepszy wynik: ${S.best.blitz || 0}</span><button class="btn" id="gAgain">Jeszcze raz</button></div>`;
  $('#gAgain').onclick = startBlitz;
}
/* --- Memory: pary polskie ↔ bułgarskie --- */
function startMemo() {
  const pool = shuffle(reachedLevels().flatMap(l => l.w.map((_, i) => W(l, i)))), pick6 = [], seenPl = new Set(), seenBg = new Set();
  for (const it of pool) { const pl = it.w[0], bg = first(it.w[1]); if (seenPl.has(pl) || seenBg.has(bg) || bg.length > 18 || pl.length > 22) continue; seenPl.add(pl); seenBg.add(bg); pick6.push({pl, bg}); if (pick6.length >= 6) break; }
  const cards = shuffle(pick6.flatMap((p, k) => [{k, txt:p.pl, bg:false}, {k, txt:p.bg, bg:true}]));
  G = {type:'memo', cards, open:[], done:new Set(), moves:0, lock:false}; drawMemo();
}
function drawMemo() {
  const box = $('#gamebox'); if (!box) return;
  box.innerHTML = `<div class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Memory · znajdź 6 par</span><span class="qcount">Ruchy: ${G.moves}</span></div>
    <div class="memo">${G.cards.map((c, i) => { const up = G.open.includes(i) || G.done.has(c.k); return `<button class="mc ${up ? 'up' : ''} ${G.done.has(c.k) ? 'got' : ''} ${c.bg ? 'isbg' : ''}" data-i="${i}" ${G.done.has(c.k) ? 'disabled' : ''}>${up ? `<span ${c.bg ? 'lang="bg"' : ''}>${esc(c.txt)}</span>` : '<span class="mc-back" aria-hidden="true"></span>'}</button>`; }).join('')}</div>
    <p class="muted" style="margin:0;font-size:14px">Bułgarskie słowa mają terakotowe obramowanie. Odkryj dwie karty – jeśli to para, zostają odkryte.</p></div>`;
  $$('#gamebox .mc').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, c = G.cards[i];
    if (G.lock || G.open.includes(i) || G.done.has(c.k)) return;
    G.open.push(i); if (c.bg && audioOK() && S.autoVoice) speak(c.txt);
    if (G.open.length === 2) {
      G.moves++; const [a, b2] = G.open.map(x => G.cards[x]);
      if (a.k === b2.k) { G.done.add(a.k); G.open = []; buzz && buzz(30); drawMemo(); if (G.done.size === 6) endMemo(); return; }
      G.lock = true; drawMemo(); setTimeout(() => { G.open = []; G.lock = false; if (G.type === 'memo') drawMemo(); }, 1000); return;
    }
    drawMemo();
  });
}
function endMemo() {
  const pts = Math.max(10, 100 - Math.max(0, G.moves - 6) * 8), rec = finishBest('memo', pts);
  addXP(Math.round(pts / 10)); save(); renderHud();
  $('#gamebox').insertAdjacentHTML('beforeend', `<div class="card stack" style="text-align:center;margin-top:12px"><b style="font-family:var(--f-display);font-size:24px">Wszystkie pary! ${pts} pkt${rec ? ' · rekord!' : ''}</b><span class="muted">${G.moves} ruchów (idealnie: 6) · +${Math.round(pts / 10)} XP</span><button class="btn" id="gAgain">Nowa plansza</button></div>`);
  $('#gAgain').onclick = startMemo;
}

/* ===== START ===== */
route();
initSpeech();
initCloud();

</script>

const b64uToBytes = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };

if (typeof renderHud === 'function') renderHud();
if (typeof route === 'function' && /^#(profil|pomoc)$/.test(location.hash)) route();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; if (location.hash === '#profil') route(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let reloading = false;
